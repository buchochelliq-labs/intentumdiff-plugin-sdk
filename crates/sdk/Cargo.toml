[package]
name = "intentumdiff-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK for writing IntentumDiff Wasm plugins in Rust"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tree-sitter = { version = "0.25", optional = true }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
wit-bindgen = { version = "0.57", default-features = false, features = ["std", "macros"] }

[features]
# Enable when compiling for wasm32-wasip2 (the default for plugins)
wasm = []
# Enable test-helper utilities and the plugin_compliance_tests! macro.
# Add to [dev-dependencies] in your plugin crate to use in #[cfg(test)].
testing = []
# Shared tree-sitter -> CST conversion (issue #47): the single implementation replacing
# per-crate template copies. Enable in tree-sitter-based parser crates.
ts-convert = ["dep:tree-sitter"]
