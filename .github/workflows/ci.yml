name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: SDK tests + wasm target check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0 (+ wasm32-wasip2)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          key: sdk-ci

      - name: Host-side unit tests
        run: cargo test --workspace

      - name: Plugin-target check (wasm32-wasip2)
        run: cargo check --workspace --features wasm --target wasm32-wasip2

      - name: WIT contract is present and non-empty
        run: test -s wit/plugin.wit
