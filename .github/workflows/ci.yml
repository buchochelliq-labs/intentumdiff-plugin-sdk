name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: SDK tests + wasm target check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0 (+ wasm32-wasip2)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-wasip2

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: sdk-ci

      - name: Host-side unit tests
        run: cargo test --workspace

      - name: Plugin-target check (wasm32-wasip2)
        run: cargo check --workspace --features wasm --target wasm32-wasip2

      - name: WIT contract is present and non-empty
        run: test -s wit/plugin.wit
